<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReactionFlow</title>
<style>
  :root {
    --ink: #14141a;
    --muted: #5b5b66;
    --line: #e7e7ec;
    --accent: #ff2d55;
    --accent2: #25f4ee;
    --bg: #fafafa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 20% 15%, rgba(37,244,238,0.10), transparent 45%),
                radial-gradient(circle at 80% 85%, rgba(255,45,85,0.12), transparent 45%),
                var(--bg);
    text-align: center;
    padding: 24px;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.01em;
    margin-bottom: 8px;
  }
  .logo span.dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); display: inline-block;
  }
  p.tagline {
    color: var(--muted);
    font-size: 16px;
    margin-bottom: 40px;
  }
  .links {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .links a {
    padding: 12px 22px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: border-color 0.15s ease;
  }
  .links a:hover {
    border-color: var(--accent);
  }
  footer {
    margin-top: 56px;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>

  <div class="logo"><span class="dot"></span>ReactionFlow</div>
  <p class="tagline">AI reaction videos, automated</p>

  <div class="links">
    <a href="/terms-of-service.html">Terms of Service</a>
    <a href="/privacy-policy.html">Privacy Policy</a>
  </div>

  <footer>Contact: <a href="mailto:10coments@gmail.com" style="color:var(--muted)">10coments@gmail.com</a></footer>

</body>
</html>
